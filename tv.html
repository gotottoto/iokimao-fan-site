:root{--ink:#173e60;--blue:#188fce;--cyan:#08b6cd;--line:#d8eaf4;--muted:#6c879c;--pale:#eefaff}

/* Clear pointer and hover feedback for interactive elements */

.tile:hover, .video-card:hover, .entry:hover { transform: translateY(-2px); border-color: var(--cyan); box-shadow: 0 7px 20px #168fd01a; }
