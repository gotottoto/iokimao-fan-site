name: Check official Mao Ioki information

on:
  schedule:
    # Daily at 06:17 JST (21:17 UTC). Avoid the top of the hour.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-info-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official sources
        run: python scripts/monitor_sources.py
      - name: Collect blog review candidates
        run: python scripts/update_blog.py
      - name: Publish new blog cards
        run: python scripts/publish_blog.py
      - name: Update TV episode candidates
        run: python scripts/update_tv.py
      - name: Commit source hashes and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor-state/source-hashes.json monitor-report.md data/blog_pending.json blog.html data/tv_episodes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Daily official information check'
            git push
          fi
