name: Check official Mao Ioki information

on:
  push:
    branches: [main]
    paths:
      - 'scripts/create_x_drafts.py'
      - '.github/workflows/check-official-info.yml'
  schedule:
    # Every 30 minutes (UTC); scheduled runs can be delayed by GitHub Actions load.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-info-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official sources
        run: python scripts/monitor_sources.py
      - name: Collect blog review candidates
        run: python scripts/update_blog.py
      - name: Publish new blog cards
        run: python scripts/publish_blog.py
      - name: Update TV episode candidates
        run: python scripts/update_tv.py
      - name: Auto-publish new official schedule items
        run: python scripts/auto_publish_updates.py
      - name: Monitor official Instagram posts
        run: python scripts/update_instagram.py
      - name: Generate X draft for new breaking news (free, no API)
        run: python scripts/create_x_drafts.py
      - name: Summarize update and X draft status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 五百城茉央 公式情報チェック結果"
            echo ""
            if [ "$JOB_STATUS" != "success" ]; then
              echo "- **チェック結果：失敗またはキャンセル**"
              echo "- 詳細は上の各ステップのログを確認してください。"
            elif git diff --quiet -- x-drafts.md; then
              echo "- **X投稿用の新しい下書き：なし**"
              echo "- 今回は新しい速報として下書きに追加された情報はありません。"
            else
              echo "- **X投稿用の新しい下書き：あり**"
              echo "- [X投稿文を開く](https://github.com/${{ github.repository }}/blob/main/x-drafts.md)"
              echo ""
              echo '```text'
              git diff --unified=0 -- x-drafts.md | grep '^+' | grep -v '^+++' | head -n 18 | sed 's/^+//' 
              echo '```'
            fi
            echo ""
            echo "- [速報データ](https://github.com/${{ github.repository }}/blob/main/data.json)"
            echo "- [監視レポート](https://github.com/${{ github.repository }}/blob/main/monitor-report.md)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Nogizaka Koujichuu archive links (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/verify_nogichuu_links.py
      - name: Commit source hashes and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A monitor-state/ monitor-report.md data/blog_pending.json data/tv_episodes.json data/nogichuu_research.json data.json blog.html x-drafts.md
          if ! git diff --cached --quiet; then
            git commit -m 'Check official information and update archives'
            git push
          fi
