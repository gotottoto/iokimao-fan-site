name: Verify Nogizaka Koujichuu archive links

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-nogichuu-archive
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official episode links
        run: python scripts/verify_nogichuu_links.py
      - name: Commit verification results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nogichuu_research.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify Nogizaka Koujichuu archive links'
            git push
          fi
